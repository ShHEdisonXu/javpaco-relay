# JavDB 演员数据每日更新：全量演员（男女统一）+ 无码演员名单。
# Actions 机房直连 JavDB 国内线路（应用级签名，与账号无关），无需翻墙。
# 抓取原理见 tools/ 里两个脚本的注释：JavDB 没有演员目录端点，只能从影片反推。
name: actors-relay

on:
  schedule:
    - cron: '10 22 * * *'   # UTC 22:10 = 北京 06:10（错开 rank-relay 21:30 / male-roster 21:40）
  workflow_dispatch:
    inputs:
      full:
        description: '填 full = 翻更多无码影片页（默认 260，约 203 页即饱和）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: actors-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ⚠️ 两个脚本默认把产物写在「脚本同级的 relay/」，但 Actions 里脚本在 tools/ 下，
      #    仓库根的 relay/ 在上一层 —— 不指定就会写 tools/relay/ 直接 ENOENT 挂掉整个 job。
      RELAY_DIR: relay
      # 无码名单翻页数（约 203 页饱和，给 300 留余量）；全量演员每维度翻页数
      UC_PAGES: ${{ inputs.full == 'full' && '600' || '300' }}
      MOVIE_PAGES: ${{ inputs.full == 'full' && '80' || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 性别判据：网页版 https://javdb.com/actors/<id> 的 section-meta（含「男優」= 男优）。
      # Actions 机房可直连 javdb.com；仓库里没有 actresses.json（名册），名册反查那一级自动跳过。
      - name: 抓 JavDB 无码演员名单（翻 type=1 无码影片反推）
        run: node tools/uncensored-actresses-crawl.js
      - name: 抓 JavDB 全量演员 + 女优补图
        run: node tools/actors-full-crawl.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/uncensored_actresses.json relay/actors_full.json relay/actress_fix.json relay/avatars_jdb/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 演员与无码名单更新 $(date -u +%F)"
            git push
          fi

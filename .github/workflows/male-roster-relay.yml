# JavDB 男优资料云端中转：Actions 机房直连国内线路（应用级签名，与账号无关），抓男优名单+头像，
# 提交 relay/roster_male.json 与 relay/avatars_male/。前端演员页「男优」大 tab 首次从
# raw.githubusercontent.com 拉回本地（国内可达），之后走本地缓存。
name: male-roster-relay

on:
  schedule:
    - cron: '40 21 * * *'   # UTC 21:40 = 北京时间 05:40，错开 rank-relay(21:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: male-roster-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取 JavDB 男优名单与头像
        run: node tools/male-roster-relay.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/roster_male.json relay/avatars_male/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 男优名单与头像更新 $(date -u +%F)"
            git push
          fi
